# Firebase App Hosting configuration for Nuxt 3
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Nuxt build (app is at the repository root)
scripts:
  buildCommand: npm run build
  runCommand: node .output/server/index.mjs

env:
  # Site URL —— 必須是「這個環境自己的網址」。
  # ⚠️ 曾經誤設為 https://l-kk.tw（舊 WordPress 站）。那個值會讓管理者通知信裡的
  #   「前往後台查看詳情」連到 l-kk.tw/admin/leads——一個還活著、但沒有後台的站，
  #    看起來像「後台壞了」而不是「連結指錯站」，很難察覺。
  # ⚠️ 也不能直接拿掉：server/utils/email.ts 的 fallback 是 lkkwellness.com，
  #    拿掉之後 dev 的信會連到「正式站後台」，測試時會看到真實客戶資料，更糟。
  - variable: NUXT_PUBLIC_SITE_URL
    value: https://lkk-website-dev--lkkdev.asia-east1.hosted.app

  # Firebase (migrated to lkkdev)
  - variable: FIREBASE_PROJECT_ID
    value: lkkdev
  # lkkdev's default bucket uses the newer .firebasestorage.app domain
  - variable: FIREBASE_STORAGE_BUCKET
    value: lkkdev.firebasestorage.app

  # Firebase client (web) config — PUBLIC values, for admin Google sign-in
  - variable: NUXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAqOFTADIc2d9CmZfe9C9oqJv92dHbFx1Q
  - variable: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: lkkdev.firebaseapp.com
  - variable: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    value: lkkdev
  - variable: NUXT_PUBLIC_FIREBASE_APP_ID
    value: "1:519198461380:web:02167a9297dd17b714e891"
  # Admin allow-list for Google sign-in (comma-separated)
  # 這是「誰能登入後台」的白名單，跟寄信無關，改錯會把人鎖在門外。
  - variable: ADMIN_ALLOWED_EMAILS
    value: lkkwellness@gmail.com,service@l-kk.tw

  # SMTP Configuration (same as Next.js web app)
  - variable: SMTP_HOST
    value: smtp.gmail.com
  - variable: SMTP_PORT
    value: "465"
  # SMTP_USER 必須是「能登入的真帳號」＝lkk@l-kk.tw。
  # service@l-kk.tw 是它的別名，別名沒有自己的密碼、無法通過 SMTP 驗證
  # （用 service@ 當 SMTP_USER 會拿到 535-5.7.8 BadCredentials）。
  # SMTP_FROM 用別名沒問題：Workspace 允許以自己帳號的網域別名寄信，不需額外驗證。
  - variable: SMTP_USER
    value: lkk@l-kk.tw
  - variable: SMTP_FROM
    value: service@l-kk.tw
  # 只有 Firestore settings/notifications.emailRecipients 為空時才會用到的保底值。
  - variable: NOTIFICATION_EMAIL
    value: service@l-kk.tw
  # ⚠️ 這個 secret 必須是 SMTP_USER 那個帳號、也就是 lkk@l-kk.tw 的應用程式密碼。
  #    Google 的應用程式密碼是「綁帳號」的，service@l-kk.tw 是別名、產不出來
  #    （上面 SMTP_USER 的註解已說明原因）。設錯會拿到 535-5.7.8 BadCredentials。
  # ⚠️ 寄信失敗是「靜默」的：server/api/leads/*.post.ts 的寄信是 fire-and-forget，
  #    錯誤只進 console.error，表單照樣回「預約成功」。名單本身不會遺失
  #    （Firestore 的寫入在寄信之前），但不會有任何人被通知。
  # 更新：npx firebase-tools apphosting:secrets:set smtp-pass --project lkkdev
  - variable: SMTP_PASS
    secret: smtp-pass

  # JWT signing secret for admin auth (REQUIRED in production).
  # Create it in lkkdev and grant access to this backend, e.g.:
  #   npx firebase-tools apphosting:secrets:set jwt-secret --project lkkdev
  #   npx firebase-tools apphosting:secrets:grantaccess jwt-secret --project lkkdev --backend lkk-website-dev
  - variable: JWT_SECRET
    secret: jwt-secret
