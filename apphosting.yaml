# Firebase App Hosting configuration for Nuxt 3
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Nuxt build (app is at the repository root)
scripts:
  buildCommand: npm run build
  runCommand: node .output/server/index.mjs

env:
  # Site URL (production domain)
  - variable: NUXT_PUBLIC_SITE_URL
    value: https://lkkwellness.com

  # Firebase — PRODUCTION project (this is the `production` branch; dev stays on main=lkkdev)
  - variable: FIREBASE_PROJECT_ID
    value: lkkprod
  - variable: FIREBASE_STORAGE_BUCKET
    value: lkkprod.firebasestorage.app

  # Firebase client (web) config — PUBLIC values, for admin Google sign-in (lkkprod)
  - variable: NUXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCgmWKWBHDPAN6o1ljTDmnKWhjGT-4qak4
  - variable: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: lkkprod.firebaseapp.com
  - variable: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    value: lkkprod
  - variable: NUXT_PUBLIC_FIREBASE_APP_ID
    value: "1:358130100336:web:d7fbf02d5e53715aa32cb5"
  # Admin allow-list for Google sign-in (comma-separated)
  - variable: ADMIN_ALLOWED_EMAILS
    value: lkkwellness@gmail.com

  # SMTP Configuration (same as Next.js web app)
  - variable: SMTP_HOST
    value: smtp.gmail.com
  - variable: SMTP_PORT
    value: "465"
  - variable: SMTP_USER
    value: lkkwellness@gmail.com
  - variable: SMTP_FROM
    value: lkkwellness@gmail.com
  - variable: NOTIFICATION_EMAIL
    value: lkkwellness@gmail.com
  # SMTP Password - reuse existing secret from Next.js
  - variable: SMTP_PASS
    secret: smtp-pass

  # JWT signing secret for admin auth (REQUIRED in production).
  # Create it in lkkdev and grant access to this backend, e.g.:
  #   npx firebase-tools apphosting:secrets:set jwt-secret --project lkkdev
  #   npx firebase-tools apphosting:secrets:grantaccess jwt-secret --project lkkdev --backend lkk-website-dev
  - variable: JWT_SECRET
    secret: jwt-secret
